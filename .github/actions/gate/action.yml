name: gate
description: >-
  Fail only when a listed job's result is `failure`. Pass `toJSON(needs)`; `success`,
  `skipped` and `cancelled` all pass. `skip-ok` is kept for callers and no longer changes the
  outcome (a skipped job always passes).
inputs:
  needs:
    description: JSON of the `needs` context, i.e. `$` + `{{ toJSON(needs) }}`.
    required: true
  skip-ok:
    description: >-
      Space-separated job ids turned off on purpose. Informational only: every skipped job
      passes the gate.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Fail on a failed job
      shell: bash
      env:
        NEEDS: ${{ inputs.needs }}
      run: bash "$GITHUB_ACTION_PATH/gate.sh"
