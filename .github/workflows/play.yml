name: play

# Reusable upload of an already signed Android App Bundle to Google Play. The caller signs
# the bundle; this workflow checks that signature and uploads it. A pull request never
# uploads: github.event_name here is the caller's event, and the upload step refuses
# pull_request and pull_request_target if it is reached.
#
# Secret (callers pass it with `secrets: inherit`):
#   PLAY_SERVICE_ACCOUNT_JSON - the Play Console service-account key, as JSON text.
#   It is handed to the upload action and is not printed.
#
#   jobs:
#     play:
#       permissions:
#         contents: read
#         actions: write # cancel-run
#       uses: pyrlyn/ci/.github/workflows/play.yml@main
#       with:
#         aab: app/build/outputs/bundle/release/app-release.aab
#         package-name: app.mailune
#         track: internal
#       secrets: inherit
#
# A bundle built by an earlier job of the same run is an artifact, not a file in
# this checkout. Set `aab-artifact` to that name. `self-signed: true` means the
# upload key is self-signed, so the check is `jarsigner -verify` without `-strict`.
on:
  workflow_call:
    inputs:
      aab:
        description: >-
          Signed Android App Bundle, relative to the repository root.
          With aab-artifact, the file name inside that artifact (optional when
          the artifact contains one .aab).
        type: string
        required: false
        default: ""
      aab-artifact:
        description: >-
          Artifact from an earlier job of this run that holds the signed bundle.
          When set, the bundle is taken from the artifact, not from the checkout.
        type: string
        required: false
        default: ""
      self-signed:
        description: >-
          The upload key is self-signed. jarsigner -verify then omits -strict,
          which rejects that key. Leave false for a Play-signed bundle.
        type: boolean
        required: false
        default: false
      package-name:
        description: Android application id.
        type: string
        required: true
      track:
        description: Play track (internal, alpha, beta, production).
        type: string
        required: false
        default: internal
      status:
        description: Release status (completed, draft, inProgress, halted).
        type: string
        required: false
        default: completed
      changes-not-sent-for-review:
        description: Leave the edit unsubmitted for review.
        type: boolean
        required: false
        default: false
      runs-on:
        description: Runner label. Needs a JDK so jarsigner can check the bundle.
        type: string
        required: false
        default: xcode-27-local
      timeout-minutes:
        description: Timeout of the job.
        type: number
        required: false
        default: 30
      cancel-run-on-failure:
        description: >-
          When the job fails, cancel the whole workflow run. The calling job must grant
          `actions: write`.
        type: boolean
        required: false
        default: true
    secrets:
      PLAY_SERVICE_ACCOUNT_JSON:
        description: Play Console service-account JSON. Not printed.
        required: false

permissions:
  contents: read
  actions: write # cancel-run on failure

jobs:
  play:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide whether this run may upload
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request|pull_request_target)
              echo "allow=false" >> "$GITHUB_OUTPUT"
              echo "Play upload skipped: a pull request does not upload"
              ;;
            *)
              echo "allow=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Fetch the pre-built bundle
        if: inputs.aab-artifact != '' && steps.gate.outputs.allow == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.aab-artifact }}
          path: ${{ runner.temp }}/aab-artifact

      # An App Bundle is a signed jar. An unsigned file is not uploaded.
      - name: Check the bundle is signed
        id: bundle
        if: steps.gate.outputs.allow == 'true'
        env:
          AAB: ${{ inputs.aab }}
          AAB_ARTIFACT: ${{ inputs.aab-artifact }}
          SELF_SIGNED: ${{ inputs.self-signed }}
          PACKAGE_NAME: ${{ inputs.package-name }}
          TRACK: ${{ inputs.track }}
          STATUS: ${{ inputs.status }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_NAME" =~ ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$ ]] \
            || { echo "package-name is not an application id" >&2; exit 1; }
          case "$TRACK" in
            internal|alpha|beta|production) ;;
            *) echo "track must be internal, alpha, beta, or production" >&2; exit 1 ;;
          esac
          case "$STATUS" in
            completed|draft|inProgress|halted) ;;
            *) echo "status is not a Play release status" >&2; exit 1 ;;
          esac
          if [ -n "$AAB_ARTIFACT" ]; then
            dir="$RUNNER_TEMP/aab-artifact"
            [ -d "$dir" ] || { echo "pre-built bundle was not downloaded" >&2; exit 1; }
            if [ -n "$AAB" ]; then
              name="${AAB##*/}"
              case "$name" in
                ""|.*|*'..'*|*'/'*|*'?'*|*'['*|*'*'*)
                  echo "aab file name is not valid" >&2
                  exit 1
                  ;;
              esac
            else
              name='*.aab'
            fi
            match=""
            count=0
            while IFS= read -r f; do
              match="$f"
              count=$((count + 1))
            done < <(find "$dir" -type f -name "$name")
            if [ -n "$AAB" ]; then
              [ "$count" -eq 1 ] || { echo "aab-artifact has $count files named $name" >&2; exit 1; }
            else
              [ "$count" -eq 1 ] || { echo "aab-artifact must contain exactly one .aab (found $count)" >&2; exit 1; }
            fi
            cp "$match" prebuilt-bundle.aab
            AAB="prebuilt-bundle.aab"
          else
            [ -n "$AAB" ] || { echo "set aab or aab-artifact" >&2; exit 1; }
            case "$AAB" in
              /*|*..*) echo "aab must be a relative path" >&2; exit 1 ;;
            esac
            [ -f "$AAB" ] || { echo "no bundle at $AAB" >&2; exit 1; }
          fi
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          # -strict rejects a self-signed upload key. Play-signed bundles keep it.
          if [ "$SELF_SIGNED" = "true" ]; then
            jarsigner -verify "$AAB"
          else
            jarsigner -verify -strict "$AAB"
          fi

      - name: Upload to Play
        if: >-
          steps.gate.outputs.allow == 'true'
          && github.event_name != 'pull_request'
          && github.event_name != 'pull_request_target'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.package-name }}
          releaseFiles: ${{ steps.bundle.outputs.aab }}
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          changesNotSentForReview: ${{ inputs.changes-not-sent-for-review }}

      - name: Cancel the run on failure
        if: failure() && inputs.cancel-run-on-failure
        uses: $/.github/actions/cancel-run # nosemgrep: github-actions-mutable-action-tag
